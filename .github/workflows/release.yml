name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: Create an alpha pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - name: Bump version and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            # Continue the current alpha line, or start one from the next ${{ inputs.bump }}.
            if [[ "$(node -p "require('./package.json').version")" == *-* ]]; then
              npm version prerelease --preid alpha
            else
              npm version "pre${{ inputs.bump }}" --preid alpha
            fi
          else
            npm version "${{ inputs.bump }}"
          fi
          git push --follow-tags
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            gh release create "$version" --generate-notes --prerelease
          else
            gh release create "$version" --generate-notes
          fi
