{{ define "title" -}}
  {{ .Title }} - {{ .Site.Title -}}
{{ end -}}
{{ define "main" -}}
  <article class="site-article">
    <header class="article-header">
      <h2>{{ .Title }}</h2>
      <aside class="article-aside" aria-label="{{ i18n "ArticleMetadata" }}">
        {{ partial "aside.html" . -}}
      </aside>
    </header>
    {{ .Content -}}
  </article>
{{ end -}}
