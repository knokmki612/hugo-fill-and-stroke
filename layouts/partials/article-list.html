<article class="site-article h-entry">
  <header class="article-header">
    <h2 class="p-name"><a class="u-url" href="{{ .Permalink }}">{{ .Title }}</a></h2>
    <aside class="article-aside" aria-label="{{ i18n "ArticleMetadata" }}">
      {{ partial "aside-list.html" . -}}
    </aside>
  </header>
  <div class="p-summary">
    {{ $sentence := findRE "<p\\b[^>]*>.*?</p>" .Content 3 -}}
    {{ delimit $sentence "\n" | safeHTML | truncate 200 -}}
  </div>
</article>
