baseURL = "https://knokmki612.github.io/hugo-fill-and-stroke/"
locale = "en-US"
title = "Fill and Stroke"
copyright = "2021 knokmki612"
defaultContentLanguage = "en"

[params]
description = "A simple site, for example"

[taxonomies]
tag = "tags"
archive = "archives"

# Build this example against the theme in the repository root.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../assets"
    target = "assets"
  [[module.mounts]]
    source = "../layouts"
    target = "layouts"
  [[module.mounts]]
    source = "../i18n"
    target = "i18n"
  [[module.mounts]]
    source = "../archetypes"
    target = "archetypes"
